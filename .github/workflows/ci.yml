name: CI

on:
  push:
    branches: [ main, "copilot/**", "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check sucheme/

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=sucheme --cov-report=xml --cov-report=html --cov-report=term-missing -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: coverage.xml
          fail_ci_if_error: false

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync

      - name: CLI smoke test
        run: |
          uv run sucheme -e "(display (+ 1 2 3))" | grep -q "^6$"
          uv run sucheme -e "(display (factorial 10))" | grep -q "3628800"
          uv run sucheme --version

      - name: Run basic samples
        run: |
          uv run sucheme samples/basic/01-hello-world.scm
          uv run sucheme samples/basic/02-arithmetic.scm
          uv run sucheme samples/basic/07-recursion.scm

      - name: Web UI health check
        run: |
          timeout 5 uv run sucheme-web &
          sleep 2
          curl -f http://127.0.0.1:5000/health || true
