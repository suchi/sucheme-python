name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -v

      - name: Build package
        run: uv build

      - name: Get version without v prefix
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            ## sucheme ${{ steps.version.outputs.VERSION }}

            R5RS準拠Schemeインタプリタ sucheme のリリースです。

            ### インストール

            ```bash
            # リポジトリからインストール（推奨）
            git clone https://github.com/suchi/sucheme-python.git
            cd sucheme-python
            uv sync

            # または wheel ファイルからインストール
            pip install sucheme-${{ steps.version.outputs.VERSION }}-py3-none-any.whl
            ```

            ### 使い方

            ```bash
            uv run sucheme                    # REPL起動
            uv run sucheme script.scm         # ファイル実行
            uv run sucheme -e "(+ 1 2 3)"     # 式評価
            uv run sucheme-web                # Web UI起動
            ```

            詳細は [README](README.md) を参照してください。
